<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    body { width: 320px; font-family: sans-serif; padding: 10px; }
    textarea { width: 100%; height: 80px; margin-bottom: 10px; }
    input, button { width: 100%; margin-bottom: 10px; padding: 8px; }
    button { background: #3861fb; color: white; border: none; cursor: pointer; font-weight: bold; }
    button:hover { background: #2f54eb; }
    .post-item { border-bottom: 1px solid #eee; padding: 5px 0; font-size: 12px; }
    .delete-btn { color: red; cursor: pointer; float: right; }
    img.preview { max-width: 50px; max-height: 50px; display: block; margin-top: 5px; }
  </style>
</head>
<body>
  <h3>CMC Scheduler</h3>
  
  <textarea id="postText" placeholder="Текст поста..."></textarea>
  
  <label>Изображение (опционально):</label>
  <input type="file" id="postImage" accept="image/*">
  
  <label>Время публикации:</label>
  <input type="datetime-local" id="postTime">
  
  <button id="scheduleBtn">Запланировать</button>
  
  <div id="status"></div>
  <h4>Очередь постов:</h4>
  <div id="postsList"></div>

  <script src="popup.js"></script>
</body>
</html>
